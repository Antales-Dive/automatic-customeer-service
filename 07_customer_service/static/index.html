<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; background: #f0f2f5; }
  #sidebar { width: 260px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; }
  #sidebar h1 { padding: 18px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #new-session-btn { margin: 12px; padding: 10px; background: #3498db; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #new-session-btn:hover { background: #2980b9; }
  #session-list { flex: 1; overflow-y: auto; }
  .session-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item:hover { background: rgba(255,255,255,.08); }
  .session-item.active { background: #3498db; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #3498db; color: #fff; border-top-right-radius: 2px; }
  .msg.assistant .bubble { background: #fff; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .msg.loading .bubble { background: #e8e8e8; color: #999; }
  #input-area { padding: 12px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
  #input-area textarea { flex: 1; resize: none; height: 44px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: inherit; }
  #input-area textarea:focus { outline: none; border-color: #3498db; }
  #send-btn, #human-btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send-btn { background: #3498db; color: #fff; }
  #send-btn:hover { background: #2980b9; }
  #human-btn { background: #e67e22; color: #fff; }
  #human-btn:hover { background: #d35400; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>💬 智能客服</h1>
  <button id="new-session-btn">＋ 新建会话</button>
  <div id="session-list"></div>
</div>
<div id="main">
  <div id="chat-header">客服助手</div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" placeholder="请输入您的问题，回车发送..."></textarea>
    <button id="human-btn">转人工</button>
    <button id="send-btn">发送</button>
  </div>
</div>

<script>
// ── 状态 ──
let currentSessionId = null;
let loading = false;

// ── API 封装 ──
const api = {
  createSession: () => fetch('/api/sessions', {method:'POST'}).then(r=>r.json()),
  listSessions: () => fetch('/api/sessions').then(r=>r.json()),
  getSession: (id) => fetch(`/api/sessions/${id}`).then(r=>r.json()),
  chat: (id, content) => fetch(`/api/chat/${id}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  }).then(r=>r.json()),
};

// ── DOM 引用 ──
const sessionListEl = document.getElementById('session-list');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const humanBtn = document.getElementById('human-btn');
const newSessionBtn = document.getElementById('new-session-btn');
const chatHeader = document.getElementById('chat-header');

// ── 会话列表 ──
async function loadSessions(activeId) {
  const sessions = await api.listSessions();
  sessionListEl.innerHTML = '';
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.session_id === activeId ? ' active' : '');
    div.textContent = s.title;
    div.onclick = () => openSession(s.session_id);
    sessionListEl.appendChild(div);
  }
}

// ── 打开会话 ──
async function openSession(id) {
  currentSessionId = id;
  location.hash = `session-${id}`;
  const detail = await api.getSession(id);
  chatHeader.textContent = detail.title;
  messagesEl.innerHTML = '';
  for (const m of detail.messages) {
    appendMsg(m.role, m.content);
  }
  await loadSessions(id);
}

// ── 新建会话 ──
async function createSession() {
  const s = await api.createSession();
  currentSessionId = s.session_id;
  chatHeader.textContent = '新会话';
  messagesEl.innerHTML = '';
  await loadSessions(s.session_id);
}

// ── 追加消息气泡 ──
function appendMsg(role, content, isLoading=false) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (isLoading ? ' loading' : '');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── 发送消息 ──
async function send() {
  const content = inputEl.value.trim();
  if (!content || loading || !currentSessionId) return;
  inputEl.value = '';
  appendMsg('user', content);
  appendMsg('assistant', '正在输入...', true);
  loading = true;
  sendBtn.disabled = true;
  try {
    const resp = await api.chat(currentSessionId, content);
    // 替换 loading 气泡
    messagesEl.removeChild(messagesEl.lastChild);
    appendMsg('assistant', resp.content);
    location.hash = `session-${currentSessionId}`;  // 同步 URL，刷新可找回
    await loadSessions(currentSessionId);
    if (chatHeader.textContent === '新会话') chatHeader.textContent = content.slice(0, 20);
  } catch (e) {
    messagesEl.removeChild(messagesEl.lastChild);
    appendMsg('assistant', '😥 请求失败，请重试。');
  }
  loading = false;
  sendBtn.disabled = false;
}

// ── 转人工 ──
async function transferHuman() {
  if (!currentSessionId) return;
  const content = inputEl.value.trim() || '用户要求转人工客服';
  inputEl.value = '';
  appendMsg('user', '转人工：' + content);
  appendMsg('assistant', '正在输入...', true);
  loading = true;
  try {
    const resp = await api.chat(currentSessionId, '我要转人工，问题描述：' + content);
    messagesEl.removeChild(messagesEl.lastChild);
    appendMsg('assistant', resp.content);
    location.hash = `session-${currentSessionId}`;  // 同步 URL，刷新可找回
    await loadSessions(currentSessionId);
  } catch (e) {
    messagesEl.removeChild(messagesEl.lastChild);
    appendMsg('assistant', '😥 请求失败，请重试。');
  }
  loading = false;
}

// ── 事件绑定 ──
sendBtn.onclick = send;
humanBtn.onclick = transferHuman;
newSessionBtn.onclick = createSession;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── 初始化：从 URL hash 恢复会话，否则新建 ──
(async function init() {
  const hash = location.hash;
  const match = hash.match(/session-([\w-]+)/);
  if (match) {
    await openSession(match[1]);
  } else {
    await createSession();
  }
})();
</script>
</body>
</html>
